{% extends 'base.html' %}
{% block title %}Pedir Chromebooks{% endblock %}
{% block content %}
<section class="panel narrow">
  <h1>Pedir Chromebooks</h1>
  <p class="muted">Faça o pedido. A TI entrega os aparelhos na sala informada.</p>
  <form method="post" class="stack" id="request-form" data-availability-url="{{ url_for('room_availability') }}">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <input type="hidden" name="operation" value="{{ request.form.get('operation') or form_token('request') }}">
    <div class="honeypot" aria-hidden="true"><label for="website">Não preencha</label><input id="website" name="website" tabindex="-1" autocomplete="off"></div>
    <label for="name">Nome do professor</label>
    <input id="name" name="name" minlength="3" maxlength="100" value="{{ request.form.get('name','') }}" required autocomplete="name">
    <label for="quantity">Quantidade</label><select id="quantity" name="quantity" required>{% for i in range(1,21) %}<option value="{{ i }}" {% if request.form.get('quantity') == i|string %}selected{% endif %}>{{ i }}</option>{% endfor %}</select>
    <label for="kind">Tipo de pedido</label>
    <select id="kind" name="kind"><option value="now">Pedir agora</option><option value="scheduled" {% if request.form.get('kind')=='scheduled' %}selected{% endif %}>Agendar entrega</option></select>
    <div id="start-field" class="stack">
      <label for="start_time">Horário da entrega — hoje (somente agendamento)</label>
      <input id="start_time" name="start_time" type="text" inputmode="numeric" pattern="([01][0-9]|2[0-3]):?[0-5][0-9]" maxlength="5" placeholder="14:00" value="{{ request.form.get('start_time','') }}">
    </div>
    <label for="expected_return">Horário previsto de devolução — hoje</label>
    <input id="expected_return" name="expected_return" type="text" inputmode="numeric" pattern="([01][0-9]|2[0-3]):?[0-5][0-9]" maxlength="5" placeholder="14:30" value="{{ request.form.get('expected_return','') }}" required>
    <label for="room">Sala de uso</label>
    <select id="room" name="room" required aria-describedby="room-status">
      <option value="">Selecione a sala</option>
      {% for room in rooms %}<option value="{{ room }}" {% if request.form.get('room') == room %}selected{% endif %}>Sala {{ room }}</option>{% endfor %}
    </select>
    <p id="room-status" class="hint" role="status">Informe os horários para consultar as salas disponíveis.</p>
    <noscript><p class="hint">A disponibilidade da sala será conferida ao enviar o pedido.</p></noscript>
    <button type="submit" class="primary">Enviar pedido à TI</button>
  </form>
</section>
<script src="{{ url_for('static',filename='request.js') }}" defer></script>
{% endblock %}
