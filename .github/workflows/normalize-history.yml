name: Ajuste pontual de autoria

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rewrite:
    if: github.actor == 'gabrieljmeira'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Reescrever autoria preservando conteudo
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          def git(*args, input=None):
              return subprocess.check_output(['git', *args], input=input)
          refs = dict(line.split()[::-1] for line in git('ls-remote', '--heads', 'origin').decode().splitlines())
          expected = {'refs/heads/main', 'refs/heads/chore/repository-cleanup'}
          assert set(refs) == expected, 'Branches inesperadas; nenhuma alteracao enviada'
          main = refs['refs/heads/main']
          cleanup = refs['refs/heads/chore/repository-cleanup']
          assert main == os.environ['GITHUB_SHA'], 'main mudou; nenhuma alteracao enviada'
          assert git('rev-parse', 'HEAD').decode().strip() == main
          mapping = {}
          changed = 0
          commits = git('rev-list', '--reverse', '--topo-order', main, cleanup).decode().splitlines()
          for old in commits:
              raw = git('cat-file', 'commit', old)
              header, body = raw.split(b'\n\n', 1)
              result = []
              skipping = False
              modified = False
              for line in header.split(b'\n'):
                  if line.startswith((b'gpgsig ', b'mergetag ')):
                      skipping = True
                      continue
                  if skipping and line.startswith(b' '):
                      continue
                  skipping = False
                  if line.startswith(b'parent '):
                      line = b'parent ' + mapping[line.split()[1].decode()].encode()
                  match = re.fullmatch(rb'(author|committer) Codex <codex@openai.com>( .*)', line)
                  if match:
                      line = match[1] + b' GahhSolos <gabrieljustin1234@gmail.com>' + match[2]
                      modified = True
                  result.append(line)
              new = git('hash-object', '-t', 'commit', '-w', '--stdin', input=b'\n'.join(result)+b'\n\n'+body).decode().strip()
              assert git('rev-parse', old+'^{tree}') == git('rev-parse', new+'^{tree}')
              assert git('show', '-s', '--format=%B', old) == git('show', '-s', '--format=%B', new)
              mapping[old] = new
              changed += int(modified)
          assert changed == 8, 'Quantidade de autores inesperada; nenhuma alteracao enviada'
          allowed = {'gabrieljustin1234@gmail.com', '00001046@sinodalprado.com.br'}
          assert set(git('log', mapping[main], '--format=%ae').decode().splitlines()) == allowed
          subprocess.run(['git', 'push', '--atomic',
              '--force-with-lease=refs/heads/main:'+main,
              '--force-with-lease=refs/heads/chore/repository-cleanup:'+cleanup,
              'origin', mapping[main]+':refs/heads/main',
              mapping[cleanup]+':refs/heads/chore/repository-cleanup'], check=True)
          print(json.dumps({'main': mapping[main], 'cleanup': mapping[cleanup], 'commits_ajustados': changed, 'conteudo_preservado': True}))
          PY
