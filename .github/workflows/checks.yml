name: Verificações
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: node --test tests/test_alerts.cjs tests/test_dashboard.cjs
      - run: npm install --prefix "$RUNNER_TEMP/browser-tools" playwright@1.56.1
      - run: node "$RUNNER_TEMP/browser-tools/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Fluxos no navegador
        run: |
          export NODE_PATH="$RUNNER_TEMP/browser-tools/node_modules"
          node tests/browser/scheduling.cjs
          node tests/browser/availability.cjs
          node tests/browser/quick_selection.cjs
          node tests/browser/management.cjs
          node tests/browser/smoke.cjs
