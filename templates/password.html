{% extends 'base.html' %}{% block title %}Minha senha{% endblock %}{% block content %}<section class="panel narrow"><h1>Minha senha</h1><p>Usuário: {{ session.username }}</p><form method="post" class="stack"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><input type="hidden" name="operation" value="{{ form_token('password') }}"><label for="old_password">Senha atual</label><input id="old_password" type="password" name="old_password" required maxlength="1024" autocomplete="current-password"><label for="password">Nova senha — mínimo 12 caracteres</label><input id="password" type="password" name="password" required minlength="12" maxlength="1024" autocomplete="new-password"><button class="primary">Alterar senha e sair</button></form></section>{% endblock %}
