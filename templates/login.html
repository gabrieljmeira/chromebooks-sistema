{% extends 'base.html' %}
{% block title %}Acesso da TI{% endblock %}
{% block content %}
<section class="panel narrow">
  <h1>Painel da TI</h1>
  <form method="post" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    {% if individual %}<label for="username">Usuário</label><input id="username" name="username" required maxlength="64" autocomplete="username" autocapitalize="none" spellcheck="false">{% endif %}
    <label for="password">Senha</label>
    <input type="password" name="password" id="password" required autocomplete="current-password">
    <button type="submit" class="primary">Entrar</button>
  </form>
</section>
{% endblock %}
