name: Verificar seleção de aparelhos
on:
  push:
    branches: [feat/quick-device-selection]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Preparar testes
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
          npm install --prefix "$RUNNER_TEMP/chromebooks-browser" playwright@1.62.1
          "$RUNNER_TEMP/chromebooks-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Validar regras e interface
        env:
          PYTHON_BIN: ${{ github.workspace }}/.venv/bin/python
          NODE_PATH: ${{ runner.temp }}/chromebooks-browser/node_modules
          SCREENSHOT_DIR: ${{ runner.temp }}/chromebooks-shots
        run: |
          .venv/bin/python -m pytest -q
          node --test tests/*.cjs
          node tests/browser/quick_selection.cjs
          node tests/browser/smoke.cjs
          node tests/browser/availability.cjs
      - name: Registrar telas de teste
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: selecao-rapida-telas
          path: ${{ runner.temp }}/chromebooks-shots
          retention-days: 3
